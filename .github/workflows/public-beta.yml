name: Public Beta Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  guardrails:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run public-beta release gate
        run: python3 scripts/release_gate.py
